<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>47都道府県 BINGO!</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="page-title">
    <span>47都道府県</span>
    <strong>BINGO!</strong>
</div>

<div class="container">

    <div class="roulette-area">

        <div class="roulette-window">
            <div id="roulette-list"></div>
        </div>

        <div id="result">
            START
        </div>

        <div class="buttons">
            <button id="startBtn">スタート</button>
            <button id="resetBtn">リセット</button>
            <button id="mapBtn">地図表示 ON/OFF</button>
        </div>

    </div>

    <div class="prefecture-panel">

        <div class="panel-title">
            都道府県
        </div>

        <div class="status-area">
            <div id="drawnCount">
                抽選済み：0県
            </div>

            <div id="remainingCount">
                残り：47県
            </div>
        </div>

        <div id="prefectureList" class="prefecture-list"></div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
