<div class="container">

```
<!-- 左側：ルーレット -->

        <div id="roulette-list"></div>

            スタート

            リセット

        <button id="mapBtn">
            地図表示 ON/OFF
        </button>

    </div>

</div>


<!-- 右側：都道府県一覧 -->
